<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#060a14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Dark Rounded Base -->
  <rect width="32" height="32" rx="8" fill="#060a14" />
  <rect width="32" height="32" rx="8" fill="url(#glowGrad)" />

  <!-- Shield Shape Border with Gradient -->
  <path d="M16 4 L26 8 C26 17 21 24 16 28 C11 24 6 17 6 8 Z" 
        fill="#0b1329" 
        stroke="url(#shieldGrad)" 
        stroke-width="1.8" 
        stroke-linejoin="round" />

